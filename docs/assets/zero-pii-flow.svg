      <rect x="0" y="68" width="252" height="28" rx="7" fill="#fef2f2" stroke="#fca5a5"/>
      <text x="10" y="86" fill="#991b1b" font-weight="700">✕ RF Phones (+7 / 8-9XX-...)</text>

      <rect x="0" y="102" width="252" height="28" rx="7" fill="#fef2f2" stroke="#fca5a5"/>
      <text x="10" y="120" fill="#991b1b" font-weight="700">✕ SNILS Numbers (XXX-XXX-XXX)</text>
    </g>

    <text x="16" y="232" fill="#0f172a" font-size="13" font-weight="800">Structural Leak Guards</text>
    <text x="16" y="252" fill="#334155" font-size="11.5">• Free-text PARAGRAPH quizzes banned</text>
    <text x="16" y="270" fill="#334155" font-size="11.5">• Filename scrubbed → #sha256.ext</text>
    <text x="16" y="288" fill="#334155" font-size="11.5">• Enforced in JS + FastAPI middleware</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="620" y1="286" x2="644" y2="286" stroke="#f57300" stroke-width="2.5" marker-end="url(#flowArrow)"/>

