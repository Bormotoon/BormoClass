    <text x="16" y="209" fill="#0f172a" font-size="12.5" font-weight="800">Binary &amp; Canvas Blob Envelope</text>
    <rect x="16" y="217" width="256" height="42" rx="8" fill="#0f172a"/>
    <text x="144" y="235" text-anchor="middle" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">BC_E2EE_BLOB_V1\0 + IV + GCM</text>
    <text x="144" y="251" text-anchor="middle" fill="#94a3b8" font-size="10">PDF scans, attachments, board scenes</text>

    <text x="16" y="279" fill="#166534" font-size="11.5" font-weight="800">+ Winnowing 5-gram 32-bit Hashes</text>
    <text x="16" y="295" fill="#475569" font-size="11">Extracted locally prior to encryption</text>
  </g>

  <!-- Vertical Trust Boundary Line between Stage 3 and Stage 4 -->
