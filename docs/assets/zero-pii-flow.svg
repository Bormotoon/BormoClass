    <text x="16" y="65" fill="#0f172a" font-size="12.5" font-weight="800">Key Derivation &amp; ECDH Wrapping</text>
    <rect x="16" y="73" width="256" height="44" rx="8" fill="#fff7ed" stroke="#fdba74"/>
    <text x="144" y="92" text-anchor="middle" fill="#9a3412" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">AES-256-GCM Class Key</text>
    <text x="144" y="109" text-anchor="middle" fill="#64748b" font-size="10.5">PBKDF2(PIN, salt, 100k) + ECDH P-256</text>

    <text x="16" y="138" fill="#0f172a" font-size="12.5" font-weight="800">Text Envelope Specification</text>
    <rect x="16" y="146" width="256" height="42" rx="8" fill="#0f172a"/>
    <text x="144" y="164" text-anchor="middle" fill="#fb923c" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">BORMO_E2EE_V1:&lt;12B_IV&gt;:&lt;CT+Tag&gt;</text>
