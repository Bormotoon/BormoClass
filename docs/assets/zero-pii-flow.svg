    <rect x="16" y="76" width="268" height="84" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="26" y="96" fill="#86efac" font-family="'JetBrains Mono', monospace" font-size="11">handle: &quot;Бодрый-Енот-428&quot;</text>
    <text x="26" y="114" fill="#fb923c" font-family="'JetBrains Mono', monospace" font-size="11">title:  &quot;BORMO_E2EE_V1:k8P...&quot;</text>
    <text x="26" y="132" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">blob:   BC_E2EE_BLOB_V1\0...</text>
    <text x="26" y="150" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">grade_five: 5  |  seat: 1</text>

    <text x="16" y="184" fill="#f8fafc" font-size="12.5" font-weight="800">Zero-Knowledge Originality Check</text>
    <rect x="16" y="194" width="268" height="58" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="26" y="214" fill="#e2e8f0" font-size="11">• Compares 32-bit Winnowing k-gram sets:</text>
    <text x="26" y="232" fill="#fdba74" font-family="'JetBrains Mono', monospace" font-size="11">  Containment = |F₁ ∩ F₂| / min(|F₁|,|F₂|)</text>
    <text x="26" y="246" fill="#94a3b8" font-size="10.5">• Structural Python AST Jaccard check</text>

    <rect x="16" y="264" width="268" height="30" rx="8" fill="#052e16" stroke="#16a34a"/>
    <text x="150" y="284" text-anchor="middle" fill="#86efac" font-size="11.5" font-weight="700">✓ DB Leak ≠ Personal Data Breach</text>
  </g>

  <!-- Bottom Summary Strip (y=458, h=80) -->
  <rect x="24" y="458" width="1232" height="80" rx="14" fill="#0f172a"/>
  <g transform="translate(44, 476)" font-family="system-ui, sans-serif">
    <text x="0" y="18" fill="#fb923c" font-size="13" font-weight="800">COMPLIANCE &amp; CRYPTOGRAPHIC INVARIANTS VERIFIED BY AUTOMATED TEST SUITE:</text>
    <text x="0" y="42" fill="#e2e8f0" font-size="12">Zero-PII Schema: zero columns for names, emails, IPs, or phones across all 43 SQLite tables. WebCrypto E2EE envelope verified.</text>
    <text x="1190" y="42" text-anchor="end" fill="#86efac" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">pytest (45 tests) • PASSED</text>
