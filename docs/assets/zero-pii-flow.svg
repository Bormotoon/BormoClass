  <!-- Outer Card -->
  <rect x="0" y="0" width="1280" height="560" rx="20" fill="#fff8f5"/>
  <rect x="1.5" y="1.5" width="1277" height="557" rx="18.5" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Header -->
  <rect x="0" y="0" width="1280" height="70" rx="20" fill="url(#secHdr)"/>
  <rect x="0" y="50" width="1280" height="20" fill="url(#secHdr)"/>
  <rect x="28" y="19" width="6" height="32" rx="3" fill="#22c55e"/>
  <text x="48" y="39" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800">Zero-PII (152-ФЗ РФ) &amp; Zero-Knowledge WebCrypto Security Pipeline</text>
  <text x="48" y="57" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">Architectural guarantee: 0 bytes of names, emails, phone numbers, SNILS, or plaintext student works ever reach SQLite or disk</text>

  <rect x="1040" y="19" width="212" height="32" rx="16" fill="#052e16" stroke="#22c55e" stroke-width="1.3"/>
  <text x="1146" y="40" text-anchor="middle" fill="#86efac" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">SERVER PII = 0 BYTES</text>

  <!-- Trust Boundary Banner -->
  <rect x="24" y="88" width="912" height="30" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
  <text x="480" y="108" text-anchor="middle" fill="#14532d" font-family="system-ui, sans-serif" font-size="12" font-weight="800">CLIENT TRUST ZONE (Browser Memory &amp; WebCrypto SubtleCrypto API)</text>

  <rect x="954" y="88" width="302" height="30" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="1105" y="108" text-anchor="middle" fill="#7f1d1d" font-family="system-ui, sans-serif" font-size="12" font-weight="800">UNTRUSTED STORAGE ZONE (Server)</text>

