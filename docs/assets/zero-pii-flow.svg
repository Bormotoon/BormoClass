  <!-- 4 HORIZONTAL PIPELINE STAGES (y=132, h=308)                             -->
  <!-- ======================================================================= -->

  <!-- STAGE 1: Callsign & Recovery (x=24, w=284) -->
  <g transform="translate(24, 132)" font-family="system-ui, sans-serif">
    <rect x="0" y="0" width="284" height="308" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="284" height="42" rx="16" fill="#0f172a"/>
    <rect x="0" y="26" width="284" height="16" fill="#0f172a"/>
    <text x="16" y="27" fill="#fb923c" font-size="13" font-weight="800">STAGE 1 • CALLSIGN PASSPORT</text>

    <text x="16" y="66" fill="#0f172a" font-size="13" font-weight="800">Pseudonymous Handle Formula</text>
    <rect x="16" y="76" width="252" height="52" rx="10" fill="#fff8f5" stroke="#fdba74"/>
    <text x="142" y="97" text-anchor="middle" fill="#c2410c" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800">Бодрый-Енот-428</text>
    <text x="142" y="117" text-anchor="middle" fill="#64748b" font-size="11">250 Adj × 250 Nouns × Code (56.2M+)</text>

    <text x="16" y="152" fill="#0f172a" font-size="13" font-weight="800">4-Word Secret Recovery</text>
    <rect x="16" y="162" width="252" height="54" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="142" y="183" text-anchor="middle" fill="#1e293b" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">маяк • компас • вектор • зенит</text>
    <text x="142" y="203" text-anchor="middle" fill="#64748b" font-size="11">512⁴ = 2³⁶ combinations (36-bit entropy)</text>

    <text x="16" y="238" fill="#0f172a" font-size="13" font-weight="800">Anti-Bot &amp; Hashing</text>
    <text x="16" y="257" fill="#334155" font-size="11.5">• PBKDF2-SHA256 (100k) &amp; scrypt</text>
    <text x="16" y="275" fill="#334155" font-size="11.5">• HMAC ticket (≥ 2s human delay)</text>
    <text x="16" y="293" fill="#334155" font-size="11.5">• Zero-IP sliding RateLimiter</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="308" y1="286" x2="332" y2="286" stroke="#f57300" stroke-width="2.5" marker-end="url(#flowArrow)"/>

