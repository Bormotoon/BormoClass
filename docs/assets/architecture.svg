<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="BormoClass System and Data-Flow Architecture">
  <defs>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f57300"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="hdrArch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="1280" height="720" rx="20" fill="#fff8f5"/>
  <rect x="1.5" y="1.5" width="1277" height="717" rx="18.5" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1280" height="68" rx="20" fill="url(#hdrArch)"/>
  <rect x="0" y="48" width="1280" height="20" fill="url(#hdrArch)"/>
  <rect x="28" y="18" width="6" height="32" rx="3" fill="#f57300"/>
  <text x="48" y="38" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800">BormoClass — End-to-End Autonomous System Architecture</text>
  <text x="48" y="56" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">Zero-CDN Browser SPA  →  Caddy TLS/SSE Edge  →  FastAPI Core &amp; Google Classroom v1 Layer  →  SQLite WAL &amp; SHA-256 CAS</text>

  <!-- Legend Pills in Header -->
  <g transform="translate(910, 20)" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">
    <rect x="0" y="0" width="166" height="28" rx="14" fill="#431407" stroke="#f57300" stroke-width="1.2"/>
    <text x="83" y="18" text-anchor="middle" fill="#fdba74">E2EE Ciphertext Flow</text>
    <rect x="178" y="0" width="164" height="28" rx="14" fill="#052e16" stroke="#22c55e" stroke-width="1.2"/>
    <text x="260" y="18" text-anchor="middle" fill="#86efac">SSE Live Stream</text>
  </g>

  <!-- ======================================================================= -->
  <!-- TIER 1: CLIENT BROWSER (y=86, h=148)                                    -->
  <!-- ======================================================================= -->
  <rect x="24" y="86" width="1232" height="148" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="24" y="86" width="1232" height="32" rx="16" fill="#f1f5f9"/>
  <rect x="24" y="104" width="1232" height="14" fill="#f1f5f9"/>
  <text x="42" y="107" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="800">1. CLIENT BROWSER LAYER — 100% LOCAL ASSETS, ZERO EXTERNAL CDN, TRUST BOUNDARY</text>
  <text x="1238" y="107" text-anchor="end" fill="#c2410c" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Plaintext stays in RAM only</text>

  <!-- 4 Client Boxes -->
  <g transform="translate(40, 128)" font-family="system-ui, sans-serif">
    <!-- Box 1.1 -->
    <rect x="0" y="0" width="286" height="92" rx="12" fill="#fff8f5" stroke="#fdba74" stroke-width="1.4"/>
    <text x="14" y="22" fill="#9a3412" font-size="13" font-weight="800">Vanilla JS ES6+ &amp; MD3 UI</text>
    <text x="14" y="41" fill="#334155" font-size="11.5">• SPA router + 7 Classroom modules</text>
    <text x="14" y="58" fill="#334155" font-size="11.5">• SpeedGrader canvas &amp; PDF scanner</text>
    <text x="14" y="75" fill="#334155" font-size="11.5">• SanPiN 1.2.3685-21 screen timer</text>

    <!-- Box 1.2 -->
    <rect x="304" y="0" width="306" height="92" rx="12" fill="#fff7ed" stroke="#f57300" stroke-width="1.8"/>
    <text x="318" y="22" fill="#c2410c" font-size="13" font-weight="800">WebCrypto E2EE Interceptor</text>
    <text x="318" y="41" fill="#334155" font-size="11.5">• Transparent window.fetch hook</text>
    <text x="318" y="58" fill="#334155" font-size="11.5">• AES-256-GCM + PBKDF2 / ECDH P-256</text>
    <text x="318" y="75" fill="#334155" font-size="11.5">• Client PII Guard + Winnowing hashes</text>

    <!-- Box 1.3 -->
    <rect x="628" y="0" width="306" height="92" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
    <text x="642" y="22" fill="#0f172a" font-size="13" font-weight="800">Excalidraw School Board</text>
    <text x="642" y="41" fill="#334155" font-size="11.5">• Custom air-gapped build (/board/:id)</text>
    <text x="642" y="58" fill="#334155" font-size="11.5">• 8 notebook rulings (5mm, 65° slant)</text>
    <text x="642" y="75" fill="#334155" font-size="11.5">• Magnetic ruler, protractor, compass</text>

    <!-- Box 1.4 -->
    <rect x="952" y="0" width="248" height="92" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
    <text x="966" y="22" fill="#166534" font-size="13" font-weight="800">PWA &amp; Service Worker</text>
    <text x="966" y="41" fill="#334155" font-size="11.5">• Pre-cached offline app shell</text>
    <text x="966" y="58" fill="#334155" font-size="11.5">• IndexedDB scene/library store</text>
    <text x="966" y="75" fill="#334155" font-size="11.5">• Local fonts (Virgil / Inter)</text>
  </g>

  <!-- Connector Arrows: Tier 1 <-> Tier 2 -->
  <line x1="420" y1="234" x2="420" y2="268" stroke="#f57300" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="432" y="256" fill="#c2410c" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">HTTPS JSON (BORMO_E2EE_V1) + Blobs (BC_E2EE_BLOB_V1)</text>

  <line x1="940" y1="270" x2="940" y2="238" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="952" y="256" fill="#15803d" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">EventSource SSE (Traffic Light &amp; Live State)</text>

  <!-- ======================================================================= -->
  <!-- TIER 2: CADDY REVERSE PROXY EDGE (y=272, h=74)                          -->
  <!-- ======================================================================= -->
  <rect x="24" y="272" width="1232" height="74" rx="14" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
  <text x="44" y="298" fill="#fb923c" font-family="system-ui, sans-serif" font-size="13" font-weight="800">2. EDGE REVERSE PROXY — CADDY 2 (edge/Caddyfile)</text>
  <g transform="translate(44, 308)" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#e2e8f0">
    <rect x="0" y="0" width="215" height="26" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="107" y="17" text-anchor="middle">Auto TLS / HTTPS + HSTS</text>

    <rect x="228" y="0" width="320" height="26" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="388" y="17" text-anchor="middle">Strict CSP: default-src &apos;self&apos;</text>

    <rect x="561" y="0" width="318" height="26" rx="6" fill="#0f172a" stroke="#22c55e"/>
    <text x="720" y="17" text-anchor="middle" fill="#86efac">SSE Proxy: flush_interval -1</text>

    <rect x="892" y="0" width="298" height="26" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="1041" y="17" text-anchor="middle">Zstd / Gzip + X-Frame DENY</text>
  </g>

  <!-- Connector Arrows: Tier 2 <-> Tier 3 -->
  <line x1="640" y1="346" x2="640" y2="378" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowSlate)"/>
  <text x="654" y="367" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">ASGI HTTP/1.1 • Cookie: pb_pass (HttpOnly HMAC-SHA256) | Bearer OAuth2</text>

  <!-- ======================================================================= -->
  <!-- TIER 3: FASTAPI APPLICATION CORE (y=382, h=170)                         -->
  <!-- ======================================================================= -->
  <rect x="24" y="382" width="1232" height="170" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="24" y="382" width="1232" height="32" rx="16" fill="#fff7ed"/>
  <rect x="24" y="400" width="1232" height="14" fill="#fff7ed"/>
  <text x="42" y="403" fill="#9a3412" font-family="system-ui, sans-serif" font-size="13" font-weight="800">3. FASTAPI BACKEND ENGINE (app/ — Python 3.12+ / Uvicorn / Pydantic v2)</text>
  <text x="1238" y="403" text-anchor="end" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Zero-Knowledge Server Processing</text>

  <!-- 5 Backend Modules -->
  <g transform="translate(40, 424)" font-family="system-ui, sans-serif">
    <!-- Mod 1: Passport -->
    <rect x="0" y="0" width="228" height="112" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="12" y="21" fill="#0f172a" font-size="12.5" font-weight="800">Passport Auth (Zero-PII)</text>
    <text x="12" y="40" fill="#334155" font-size="11">• 250×250 Callsign generator</text>
    <text x="12" y="56" fill="#334155" font-size="11">• 4-word recovery (36-bit)</text>
    <text x="12" y="72" fill="#334155" font-size="11">• PBKDF2 / scrypt + Tickets</text>
    <text x="12" y="88" fill="#334155" font-size="11">• Recess gamification wallet</text>
    <text x="12" y="103" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">app/passport/</text>

    <!-- Mod 2: PII Guard -->
    <rect x="242" y="0" width="224" height="112" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
    <text x="254" y="21" fill="#991b1b" font-size="12.5" font-weight="800">152-FZ PII Firewall</text>
    <text x="254" y="40" fill="#334155" font-size="11">• Blocks FIO, Email, Phone</text>
    <text x="254" y="56" fill="#334155" font-size="11">• Blocks SNILS (HTTP 422)</text>
    <text x="254" y="72" fill="#334155" font-size="11">• Student phrase whitelist</text>
    <text x="254" y="88" fill="#334155" font-size="11">• Filename SHA-256 scrubber</text>
    <text x="254" y="103" fill="#991b1b" font-family="'JetBrains Mono', monospace" font-size="10">pii_guard.py</text>

    <!-- Mod 3: Classroom & Analytics -->
    <rect x="480" y="0" width="268" height="112" rx="12" fill="#fff8f5" stroke="#f57300" stroke-width="1.6"/>
    <text x="492" y="21" fill="#c2410c" font-size="12.5" font-weight="800">Classroom, Quizzes &amp; СОУ</text>
    <text x="492" y="40" fill="#334155" font-size="11">• 40-desk map, Call Wheel, Teams</text>
    <text x="492" y="56" fill="#334155" font-size="11">• Simonov СОУ / КЗ / Усп &amp; ФГОС</text>
    <text x="492" y="72" fill="#334155" font-size="11">• 6-type Quizzes &amp; Practice Sets</text>
    <text x="492" y="88" fill="#334155" font-size="11">• Winnowing 5-gram + Python AST</text>
    <text x="492" y="103" fill="#c2410c" font-family="'JetBrains Mono', monospace" font-size="10">app/classroom/</text>

    <!-- Mod 4: Google Classroom v1 -->
    <rect x="762" y="0" width="236" height="112" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.4"/>
    <text x="774" y="21" fill="#3730a3" font-size="12.5" font-weight="800">Google Classroom API v1</text>
    <text x="774" y="40" fill="#334155" font-size="11">• Courses, Roster, Aliases</text>
    <text x="774" y="56" fill="#334155" font-size="11">• CourseWork, Submissions</text>
    <text x="774" y="72" fill="#334155" font-size="11">• Rubrics, Periods, Groups</text>
    <text x="774" y="88" fill="#334155" font-size="11">• updateMask &amp; fields mask</text>
    <text x="774" y="103" fill="#3730a3" font-family="'JetBrains Mono', monospace" font-size="10">app/v1/ (24 scopes)</text>

    <!-- Mod 5: SSE Hub & Admin -->
    <rect x="1012" y="0" width="188" height="112" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
    <text x="1024" y="21" fill="#166534" font-size="12.5" font-weight="800">SSE Hub &amp; Admin</text>
    <text x="1024" y="40" fill="#334155" font-size="11">• Async pub/sub queues</text>
    <text x="1024" y="56" fill="#334155" font-size="11">• RFC 5545 .ics feeds</text>
    <text x="1024" y="72" fill="#334155" font-size="11">• OneRoster CSV sync</text>
    <text x="1024" y="88" fill="#334155" font-size="11">• Data Takeout ZIP</text>
    <text x="1024" y="103" fill="#166534" font-family="'JetBrains Mono', monospace" font-size="10">sse_hub.py • admin</text>
  </g>

  <!-- Connector Arrows: Tier 3 -> Tier 4 -->
  <line x1="360" y1="552" x2="360" y2="584" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowSlate)"/>
  <text x="374" y="573" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">SQLite WAL + Foreign Keys</text>

  <line x1="910" y1="552" x2="910" y2="584" stroke="#f57300" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="924" y="573" fill="#c2410c" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">SHA-256 Deduplicated Blobs</text>

  <!-- ======================================================================= -->
  <!-- TIER 4: AUTONOMOUS LOCAL STORAGE (y=588, h=110)                          -->
  <!-- ======================================================================= -->
  <g transform="translate(24, 588)" font-family="system-ui, sans-serif">
    <!-- Left Storage: SQLite WAL -->
    <rect x="0" y="0" width="604" height="110" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="18" y="16" width="44" height="44" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.4"/>
    <text x="40" y="44" text-anchor="middle" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800">DB</text>
    <text x="76" y="33" fill="#ffffff" font-size="14.5" font-weight="800">4A. SQLite 3 Embedded Database (WAL Mode + 256 MiB mmap)</text>
    <text x="76" y="54" fill="#cbd5e1" font-size="12">43 normalized tables: users, classes, coursework, submissions, rubrics, quizzes, audit_logs.</text>
    <text x="76" y="74" fill="#94a3b8" font-size="11.5">Stores only random callsigns, PBKDF2/scrypt hashes, grades, and BORMO_E2EE_V1 envelopes.</text>
    <text x="76" y="94" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">PRAGMA journal_mode=WAL; synchronous=NORMAL; busy_timeout=5000;</text>

    <!-- Right Storage: SHA-256 CAS -->
    <rect x="628" y="0" width="604" height="110" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="646" y="16" width="44" height="44" rx="10" fill="#1e293b" stroke="#f57300" stroke-width="1.4"/>
    <text x="668" y="44" text-anchor="middle" fill="#fb923c" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800">CAS</text>
    <text x="704" y="33" fill="#ffffff" font-size="14.5" font-weight="800">4B. SHA-256 Content-Addressable Blob Storage (app/storage/)</text>
    <text x="704" y="54" fill="#cbd5e1" font-size="12">2-char prefix sharding (data/storage/aa/&lt;sha256&gt;) with atomic rename deduplication.</text>
    <text x="704" y="74" fill="#94a3b8" font-size="11.5">Materializes VIEW / EDIT / STUDENT_COPY ACLs with zero blob duplication &amp; HTTP 206 Range.</text>
    <text x="704" y="94" fill="#fb923c" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Envelope: BC_E2EE_BLOB_V1\0 + 12B IV + AES-256-GCM Ciphertext</text>
  </g>
</svg>
