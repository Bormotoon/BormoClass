<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <base href="/static/board/" />
    <!-- user-scalable=no намеренно: масштаб на доске делает сам холст (щипок,
         колесо, кнопки внизу слева). Без запрета браузер перехватывал бы щипок
         на себя и вместо приближения рисунка растягивал бы страницу с панелями. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Интерактивная школьная доска BormoClass (self-hosted open source аналог Google Classroom): рисование от руки, чертёжные инструменты, школьные разлиновки, 100% офлайн без внешних CDN." />
    <title>Интерактивная доска — BormoClass (Self-Hosted Google Classroom Alternative)</title>

    <!-- Шрифты рисунка (Excalifont, Nunito, Cascadia и др.) библиотека грузит
         через fetch по window.EXCALIDRAW_ASSET_PATH. Раздаются локально без внешних CDN. -->
    <script src="/static/js/e2ee-crypto.js"></script>
    <script>
      window.EXCALIDRAW_ASSET_PATH = new URL("./", document.baseURI).href;
    </script>

    <style>
      html, body, #app, .pb-stage { margin: 0; height: 100%; }
      body { overscroll-behavior: none; }
      .pb-boot {
        display: flex; align-items: center; justify-content: center; height: 100%;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #666;
      }
      .bc-back-btn {
        position: fixed;
        top: 12px;
        left: 56px;
        z-index: 10;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 36px;
        padding: 0 14px;
        background: var(--island-bg-color, #ffffff);
        color: var(--text-primary-color, #1b1b1f);
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 10px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        font: 600 13px system-ui, -apple-system, sans-serif;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.15s, transform 0.1s;
      }
      .bc-back-btn:hover {
        background: #f5f5f5;
        transform: translateY(-1px);
      }
      .bc-back-btn:active {
        transform: translateY(0);
      }
    </style>
    <script type="module" crossorigin src="./assets/index-C4V585MD.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DNiJ6WQi.css">
  </head>
  <body>
    <button type="button" class="bc-back-btn" id="bcBackBtn" title="Вернуться в BormoClass">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m15 18-6-6 6-6"/>
      </svg>
      <span>В класс</span>
    </button>
    <div id="app"><div class="pb-boot">Загружаем интерактивную доску Excalidraw…</div></div>

    <script>
      document.getElementById("bcBackBtn").addEventListener("click", () => {
        const parts = window.location.pathname.split("/").filter(Boolean);
        const last = parts[parts.length - 1];
        const cid = Number(last);
        if (cid && !isNaN(cid)) {
          window.location.href = "/#class/" + cid;
        } else if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = "/";
        }
      });
    </script>
  </body>
</html>
